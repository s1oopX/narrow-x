# Rate-limit keys: all traffic reaches this loopback-only server through the
# Cloudflare Tunnel, so CF-Connecting-IP is the real client address. Fall back
# to the socket address when the header is absent (direct local requests).
map $http_cf_connecting_ip $astro_limit_key {
    default $http_cf_connecting_ip;
    ''      $binary_remote_addr;
}

limit_req_zone $astro_limit_key zone=astro_oauth:1m rate=30r/m;
limit_req_zone $astro_limit_key zone=astro_deploy:1m rate=10r/m;

server {
    listen 127.0.0.1:80;
    server_name example.com;
    root /var/www/narrow-x/current;
    index index.html;

    client_max_body_size 1m;
    client_body_timeout 10s;

    # Nginx add_header inheritance: any location that declares its own
    # add_header drops every inherited one, so this full set is re-declared in
    # each location below that uses add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # External origins in use: giscus.app (comments script + iframe). Inline
    # scripts (theme init) and inline styles are part of the built pages, so
    # script-src allows only hashed inline scripts (scripts/gen-csp-hashes.mjs
    # keeps the list in sync; the deploy pipeline fails on drift). style-src
    # keeps 'unsafe-inline' for inline style attributes. img/media allow
    # https: because post content may reference external images.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-6sv3bMO9MMM798FEc9t5R8xVOUMXRrLh3KpCamVIlx8=' 'sha256-HwrI04nrCMB4R7QiXcvajWfacEEVBnRAoV/csts+9KQ=' 'sha256-bhUNXfKWl+StMZISZeCN7CkFkDUzN5SVPJu2cRr4uvM=' 'sha256-bq227xSas+PRqF3Qp2vvvDwyXmHY65gSnWIFJTHY36w=' 'sha256-mQzJ5xVv7kYNkx3rU1cVjhOmPeLWI75FwfyH64J6Yhs=' https://giscus.app; style-src 'self' 'unsafe-inline' https://giscus.app; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://giscus.app; frame-src https://giscus.app; media-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; worker-src 'self' blob:; manifest-src 'self'" always;

    error_page 404 =404 /404.html;

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        try_files $uri =500;
    }

    location = /admin/index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Sveltia CMS: self-hosted bundle, GitHub API/content over fetch,
        # blob: workers and previews. The admin page must never be framed.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; font-src 'self' data:; connect-src 'self' https://github.com https://*.github.com https://*.githubusercontent.com; media-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self' https://github.com; frame-ancestors 'none'; worker-src 'self' blob:" always;
        try_files $uri =404;
    }

    location /oauth {
        limit_req zone=astro_oauth burst=30 nodelay;
        limit_req_status 429;
        # The OAuth service sets its own security headers on HTML responses;
        # only HSTS is added here (declaring it drops the inherited set).
        add_header Strict-Transport-Security "max-age=15552000" always;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /deploy/github {
        limit_req zone=astro_deploy burst=20 nodelay;
        limit_req_status 429;
        add_header Strict-Transport-Security "max-age=15552000" always;
        proxy_pass http://127.0.0.1:4181;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location ~ ^/giscus-(light|dark)\.css$ {
        add_header Access-Control-Allow-Origin "https://giscus.app" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-6sv3bMO9MMM798FEc9t5R8xVOUMXRrLh3KpCamVIlx8=' 'sha256-HwrI04nrCMB4R7QiXcvajWfacEEVBnRAoV/csts+9KQ=' 'sha256-bhUNXfKWl+StMZISZeCN7CkFkDUzN5SVPJu2cRr4uvM=' 'sha256-bq227xSas+PRqF3Qp2vvvDwyXmHY65gSnWIFJTHY36w=' 'sha256-mQzJ5xVv7kYNkx3rU1cVjhOmPeLWI75FwfyH64J6Yhs=' https://giscus.app; style-src 'self' 'unsafe-inline' https://giscus.app; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://giscus.app; frame-src https://giscus.app; media-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
    }
}

server {
    listen 127.0.0.1:80;
    server_name www.example.com;
    add_header Strict-Transport-Security "max-age=15552000" always;
    return 301 https://example.com$request_uri;
}

server {
    listen 127.0.0.1:80;
    server_name alt.example.com www.alt.example.com;
    root /var/www/narrow-x/current;

    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files /domain-moved.html =404;
    }
}
